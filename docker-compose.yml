services:
  tele-proxy:
    build:
      context: .
    ports:
      # 8080 = /aq/ + /health. Objetivo Pingora (`add_tcp`); hoy lo sirve Axum, porque la portación
      # de la Fase 3 no está terminada (docs/spec.md, "Estado de la migración"). Es el único puerto
      # expuesto al público detrás del TLS de Dokploy.
      #
      # TRAEFIK/DOKPLOY: el puerto de control se publica en TODAS las interfaces (igual que este),
      # no en loopback: el Traefik de Dokploy vive en otro contenedor y 127.0.0.1 del host no le
      # sirve (evidencia: la ruta `/` funciona con Port 8784 = puerto publicado; la ruta al panel
      # moría con el binding loopback). El panel sigue sin exponerse por el puerto del proxy: se
      # sirve en el de control, alcanzable vía subdominio en Dokploy (p.ej. admin.teleproxy.velone.ai).
      # El puerto interno del contenedor iguala al publicado porque Dokploy enruta al puerto que
      # configura en el dominio según la versión (contenedor o host).
      - "${HTTP_PROXY_PORT:-8080}:${HTTP_PROXY_PORT:-8080}"
      - "${HTTP_CONTROL_PORT:-8081}:${HTTP_CONTROL_PORT:-8081}"
    environment:
      - RUST_LOG=${RUST_LOG:-warn,tele_proxy=info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      # desarrollo → errores HTTP verbosos; cualquier otro valor mantiene los errores escuetos.
      - MODO=${MODO:-produccion}
      - HTTP_HOST=0.0.0.0
      - HTTP_PROXY_PORT=${HTTP_PROXY_PORT:-8080}
      - HTTP_CONTROL_PORT=${HTTP_CONTROL_PORT:-8081}
      # ServerConf de Pingora (docs/ENVIRONMENT.md). threads vale 1 por defecto en Pingora: sin
      # PROXY_WORKER_THREADS el proxy es mono-thread aunque el host tenga 8 núcleos.
      - PROXY_WORKER_THREADS=${PROXY_WORKER_THREADS:-4}
      - PROXY_WORK_STEALING=${PROXY_WORK_STEALING:-true}
      - PROXY_GRACE_PERIOD_SECONDS=${PROXY_GRACE_PERIOD_SECONDS:-10}
      - UPSTREAM_KEEPALIVE_POOL_SIZE=${UPSTREAM_KEEPALIVE_POOL_SIZE:-128}
      - COUCHDB_URL=http://velone-servicios:5984
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_DB_NAME=${COUCHDB_DB_NAME:-tele_proxy_configs}
      - VALKEY_URL=redis://:${VALKEY_PASSWORD}@velone-servicios:6379
      # Deadline y límite del sandbox Lua (`docs/ENVIRONMENT.md` § Límites del sistema): son las
      # variables que hoy lee `AppConfig::from_env`, así que se pasan por compose para poder
      # ajustarlas sin rebuild. Los dos timeouts fuera de 1..=60000 hacen que el proceso no arranque.
      - LUA_TIMEOUT_MS=${LUA_TIMEOUT_MS:-200}
      - LUA_MEMORY_LIMIT_MB=${LUA_MEMORY_LIMIT_MB:-50}
      - WEBHOOK_TIMEOUT_MS=${WEBHOOK_TIMEOUT_MS:-5000}
      - FALLBACK_TIMEOUT_MS=${FALLBACK_TIMEOUT_MS:-5000}
      # Techos de bytes: baseline de runtime_settings, recargables en caliente por el panel.
      # Fuera de rango el arranque falla (docs/ENVIRONMENT.md § Validaciones).
      - MAX_RESPONSE_SIZE_BYTES=${MAX_RESPONSE_SIZE_BYTES:-104857600}
      - MAX_CACHEABLE_SIZE_BYTES=${MAX_CACHEABLE_SIZE_BYTES:-5242880}
      # --- Administración (docs/ENVIRONMENT.md § Administración) ---
      # Fallback de emergencia para /api/v1/admin/*; vacío = deshabilitado. Nunca fijarlo en el repo.
      - MASTER_BEARER_TOKEN=${MASTER_BEARER_TOKEN:-}
      # Login Google del panel: sin ambas el login OAuth queda deshabilitado (solo master token).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Solo emails de estos dominios pueden ser admin (comparación exacta, case-insensitive).
      - ADMIN_ALLOWED_DOMAINS=${ADMIN_ALLOWED_DOMAINS:-gmail.com,stringnet.pe}
      - ADMIN_SESSION_TTL_SECONDS=${ADMIN_SESSION_TTL_SECONDS:-3600}
      - ADMIN_OAUTH_STATE_TTL_SECONDS=${ADMIN_OAUTH_STATE_TTL_SECONDS:-300}
      - ADMIN_LOGIN_RATE_LIMIT_REQUESTS=${ADMIN_LOGIN_RATE_LIMIT_REQUESTS:-5}
      - ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS=${ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      - ADMIN_RATE_LIMIT_REQUESTS=${ADMIN_RATE_LIMIT_REQUESTS:-120}
      - ADMIN_RATE_LIMIT_WINDOW_SECONDS=${ADMIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      - CONTROL_RATE_LIMIT_REQUESTS=${CONTROL_RATE_LIMIT_REQUESTS:-60}
      - CONTROL_RATE_LIMIT_WINDOW_SECONDS=${CONTROL_RATE_LIMIT_WINDOW_SECONDS:-60}
      # --- UI externa (CORS, docs/ENVIRONMENT.md § Administración) ---
      # Vacío = modo embebido actual. Fijada: cookie SameSite=None y redirect post-login a la UI.
      - ADMIN_UI_URL=${ADMIN_UI_URL:-}
      # Allowlist de orígenes EXACTOS (coma-separada). Vacío = sin capa CORS (comportamiento actual).
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # --- Preview /mt/ y /pv/ (docs/ENVIRONMENT.md § Preview) ---
      # BROWSERLESS_URL vacío = /pv/ responde 503 render_unavailable (fail-soft); /mt/ no depende
      # del sidecar y sigue funcionando. El sidecar vive SOLO en red-preview (ver servicio
      # `browserless`), así que tele-proxy necesita estar en esa red para alcanzarlo.
      - BROWSERLESS_URL=${BROWSERLESS_URL:-http://browserless:3000}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-}
      - RENDER_TIMEOUT_MS=${RENDER_TIMEOUT_MS:-30000}
      - PREVIEW_ASSET_MAX_BYTES=${PREVIEW_ASSET_MAX_BYTES:-10485760}
    restart: unless-stopped
    # Debe superar a PROXY_GRACE_PERIOD_SECONDS o Docker manda SIGKILL antes de que Pingora
    # drene las conexiones en curso (el proceso no se daemoniza nunca: sin -d/--daemon).
    stop_grace_period: 15s
    # velone-servicios es un hostname de Tailscale MagicDNS (100.70.199.122). Docker no hereda
    # el DNS de Tailscale del host, así que hay que mapearlo explícitamente para que el contenedor
    # alcance CouchDB y Valkey en la red de Tailscale.
    extra_hosts:
      - "velone-servicios:100.70.199.122"
    networks:
      - default
      - dokploy-network
      - red-velone
      # Única red compartida con el sidecar de render: tele-proxy habla con browserless por aquí.
      - red-preview

  # Sidecar de render para /pv/ (PLAN_PREVIEW.md D7). Chromium navega a la URL pedida, por lo que
  # es un vector SSRF si alcanza la red interna: por eso se le aísla en `red-preview` y NO se le
  # une a red-velone/dokploy-network/default, que son las que llegan a CouchDB y Valkey
  # (velone-servicios). Con esta topología el Chromium puede salir a Internet para renderizar
  # páginas públicas pero no tiene ruta a los almacenes internos. Limitación: un bridge de Docker
  # sigue permitiendo egreso a Internet; el bloqueo total de destinos exigiría un firewall o
  # enrutar el Chromium a través de tele-proxy como proxy HTTP (fuera del alcance de este compose).
  browserless:
    image: ghcr.io/browserless/chromium:v2.27.0
    environment:
      # Sin TOKEN cualquiera en red-preview podría pedir renders; se fija para que tele-proxy
      # autentique sus llamadas (?token=) y el sidecar rechace el resto.
      - TOKEN=${BROWSERLESS_TOKEN:-}
      - CONCURRENT=${BROWSERLESS_CONCURRENT:-5}
      - QUEUED=${BROWSERLESS_QUEUED:-5}
      # Techo por sesión del sidecar; RENDER_TIMEOUT_MS de tele-proxy debe quedar por debajo para
      # que sea el proxy quien cancele y devuelva 504 render_timeout antes que el sidecar.
      - TIMEOUT=${BROWSERLESS_TIMEOUT:-45000}
    # Sin `ports:` publicado: el sidecar no se expone al host ni al público, solo es alcanzable
    # desde tele-proxy a través de red-preview.
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      # /pressure es el endpoint que también consulta `BrowserlessRenderer::healthy()`.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/pressure || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - red-preview

networks:
  dokploy-network:
    driver: bridge
  red-velone:
    driver: bridge
  # Red exclusiva tele-proxy ↔ browserless. `internal: false` (por omisión) para que el Chromium
  # pueda salir a Internet a renderizar; el aislamiento de la red interna se logra NO uniendo el
  # sidecar a red-velone/dokploy-network/default.
  red-preview:
    driver: bridge
