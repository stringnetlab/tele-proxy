[package]
name = "tele-proxy"
version = "1.0.0"
edition = "2021"
# pingora-proxy del rev pineado exige Rust >= 1.85 (rust-version en su Cargo.toml)
rust-version = "1.85"
description = "Secure reverse proxy with DDD architecture, anti-SSRF, and Lua scripting"
license = "MIT"

[[bin]]
name = "tele-proxy"
path = "src/main.rs"

[features]
# `proxy-engine`/`proxy` quedan opcionales mientras la portación Axum -> Pingora no termine
# (docs/spec.md Fase 3): en Windows no se puede compilar pingora. El Dockerfile construye
# SIEMPRE con --features proxy (default) salvo que se pase el build arg PROXY_FEATURES.
default = []
# Motor de proxy (Pingora). No incluye backend TLS de reqwest: cada variante lo trae.
proxy-engine = ["pingora-core", "pingora-proxy", "pingora-http", "pingora-limits"]
# Variante DEFAULT y documentada: reqwest sobre rustls (coherencia del árbol cripto con el
# `ring` de hickory-resolver, runtime sin OpenSSL, build más rápido).
proxy = ["proxy-engine", "reqwest/rustls"]
# Variante opt-in para orígenes que fingerprintan el JA3 de rustls (Meta properties responden
# 302 a /unsupportedbrowser; con OpenSSL devuelven 200 — verificado contra el contenedor).
# OpenSSL **vendored** (compilado estático desde openssl-src): el runtime sigue sin libssl.
# EXCLUYENTE con `proxy` (features hermanas, no aditivas): no las actives a la vez; si ambas
# cayeran activas (--all-features), http_client::pinned_client fuerza native-tls. El DoT del
# resolver DNS se queda en ring en ambas variantes.
proxy-openssl = ["proxy-engine", "reqwest/native-tls-vendored"]

[dependencies]
# --- Async Runtime ---
tokio = { version = "1.53", features = ["full"] }

# --- Web Framework ---
axum = { version = "0.8", features = ["macros"] }

# --- Proxy Engine (Cloudflare) - Linux/Docker only ---
# default-features = false + features = ["rustls"]: pingora-core/pingora-proxy declaran
# `default = []`, así que NINGÚN backend TLS viene activado por defecto y sin `rustls` las
# peticiones https:// al origen fallan. rustls mantiene el runtime sin libssl y coincide con
# el backend `ring` de hickory-resolver (tls-ring); el backend TLS de reqwest lo elige la
# variante del binario (`proxy` = rustls, `proxy-openssl` = native-tls-vendored).
# rev exacto, nunca rama móvil (RUST_STYLE_GUIDE.md §8): con `branch = "main"` un push de
# Cloudflare cambiaría el commit al regenerar el lock, y aquí las firmas de la documentación
# están citadas línea por línea contra 4487f7b2.
pingora-core = { git = "https://github.com/cloudflare/pingora", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19", default-features = false, features = ["rustls"], optional = true }
pingora-proxy = { git = "https://github.com/cloudflare/pingora", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19", default-features = false, features = ["rustls"], optional = true }
pingora-http = { git = "https://github.com/cloudflare/pingora", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19", optional = true }
# Rate limit in-process para el modo degradado de Valkey (docs/spec.md Fase 3 y Fase 5)
pingora-limits = { git = "https://github.com/cloudflare/pingora", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19", optional = true }

# --- HTTP ---
hyper = { version = "1.11", features = ["full"] }
http = "1.5"
# Backend TLS de reqwest según la variante del binario: `proxy` añade "rustls" y
# `proxy-openssl` añade "native-tls-vendored" (ver [features]). En desarrollo en Windows
# (default = []) reqwest compila sin TLS: las pruebas unitarias no hacen red.
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "query"] }

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# postcard replaces bincode: bincode is unmaintained (crates.io 3.0.0 is a
# compile_error tombstone) and 1.3 is end-of-life. postcard is serde-based and maintained.
# `to_allocvec` is gated behind the `alloc` feature.
postcard = { version = "1.1", features = ["alloc"] }

# --- Database & Cache ---
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }
moka = { version = "0.12", features = ["future"] }

# --- DNS ---
hickory-resolver = { version = "0.26", features = ["dnssec-ring", "tls-ring", "tokio", "webpki-roots"] }

# --- Cache LRU ---
lru = "0.18"

# --- Scripting ---
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "async"] }

# --- IDs ---
nanoid = "0.5"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# --- Error Handling ---
thiserror = "2.0"

# --- URL ---
url = "2.5"

# --- Crypto ---
sha2 = "0.11"

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- Regex ---
regex = "1.13"

# --- Misc ---
bytes = "1.12"
futures = "0.3"
async-trait = "0.1"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
