openapi: 3.0.3
info:
  title: Tele-Proxy API
  version: 1.0.0
  description: |
    API de proxy de acceso remoto con dos niveles de seguridad:
    - Endpoint público sin autenticación (solo whitelist + rate limit)
    - Endpoints de control con Bearer token

paths:
  # ========================================
  # ENDPOINT PÚBLICO (Sin Autenticación)
  # ========================================
  /aq/{crypt_id}/:
    get:
      summary: Proxy público de recursos externos
      description: |
        Endpoint público sin autenticación. La seguridad se gestiona mediante:
        - Validación del crypt_id (nanoid de 12 caracteres)
        - Whitelist de dominios permitidos
        - Rate limit por crypt_id
        - Validación estricta anti-SSRF

        Solo registra errores (4xx, 5xx, bloqueos). No registra solicitudes exitosas.
      parameters:
        - name: crypt_id
          in: path
          required: true
          description: |
            Identificador criptográfico público del cliente (nanoid de 12 caracteres URL-safe).
            Este ID puede ser rotado por el cliente vía la API de control si se detecta abuso.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{12}$"
            example: "V1StGXR8_Z5j"

        - name: url
          in: query
          required: true
          description: |
            URL del recurso externo a proxificar. Debe estar URL-encoded.
            Solo se permiten esquemas http:// y https://.
            No se permiten credenciales embebidas (user:pass@) ni fragmentos (#).
          schema:
            type: string
            format: uri
            example: "https%3A%2F%2Fshutterstock.com%2Fimagen.jpg"

        - name: mime
          in: query
          required: false
          description: |
            MIME type esperado del recurso (opcional).
            Se usa para seleccionar el fallback de error adecuado si el origen falla.
            Prioridad de inferencia: 1) Este parámetro, 2) Extensión de la URL,
            3) `Content-Type` del origen, 4) `application/octet-stream`.
            El header `Accept` del cliente NO interviene: selecciona lo que el cliente acepta,
            no lo que el recurso es, y usarlo para elegir un fallback confundiría un 404
            de imagen con uno de PDF.
          schema:
            type: string
            example: "image/png"

      responses:
        "200":
          description: Recurso obtenido exitosamente
          content:
            "*/*":
              schema:
                type: string
                format: binary
                description: El cuerpo del recurso (imagen, PDF, HTML, etc.)
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
            X-Proxy-By:
              $ref: "#/components/headers/X-Proxy-By"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"

        "400":
          description: URL malformada o con esquema inválido
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid_url_format"
                message: "Formato de URL inválido: URL contains credentials"

        "403":
          description: Dominio no autorizado o SSRF bloqueado
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                domain_not_whitelisted:
                  summary: Dominio fuera de whitelist
                  value:
                    error: "domain_not_whitelisted"
                    message: "Dominio no permitido: malicious.com"
                ssrf_blocked:
                  summary: Intento de SSRF
                  value:
                    error: "ssrf_blocked"
                    message: "Bloqueo anti-SSRF: resolves to private IP"

        "404":
          description: crypt_id inválido o inexistente
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_crypt_id:
                  summary: crypt_id con formato inválido o sin cliente en CouchDB
                  value:
                    error: "invalid_crypt_id"
                    message: "crypt_id inválido: not found"
                config_not_found:
                  summary: La configuración del cliente no existe
                  value:
                    error: "config_not_found"
                    message: "Configuración no encontrada para el cliente: client_123"

        "413":
          description: El cuerpo superado `max_response_size_bytes`
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "payload_too_large"
                message: "Cuerpo demasiado grande: 15728640 bytes (máx: 10485760)"

        "429":
          description: Rate limit excedido
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
              description: Segundos hasta que se puede reintentar
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "rate_limit_exceeded"
                message: "Límite de peticiones excedido"

        "500":
          description: Fallo del proxy o del script Lua (ver ERROR_DICTIONARY.md)
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal_error:
                  summary: Fallo no clasificado
                  value:
                    error: "internal_error"
                    message: "Error interno: cache write failed"
                integrity_check_failed:
                  summary: El hash del script o del fallback no coincide
                  value:
                    error: "integrity_check_failed"
                    message: "Falló la verificación de integridad de lua_script"

        "502":
          description: Error al obtener el recurso del origen o fallo DNS
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                upstream_error:
                  summary: El origen devolvió 4xx/5xx sin fallback aplicable
                  value:
                    error: "upstream_error"
                    message: "Error del origen: status=503, motivo=upstream returned an error status"
                dns_resolution_failed:
                  summary: Todos los resolvers DoT fallaron
                  value:
                    error: "dns_resolution_failed"
                    message: "Falló la resolución DNS de unknown.example: nxdomain"

  # ========================================
  # ENDPOINTS DE CONTROL (Bearer Token)
  # ========================================
  /api/v1/clients/config:
    get:
      summary: Obtiene la configuración del cliente autenticado
      description: |
        Devuelve la configuración completa del cliente, incluyendo:
        - crypt_id actual (público, rotable)
        - whitelist de dominios
        - rate limit
        - configuración de scripting
        - manejo de errores
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfigResponse"
        "401":
          description: Token Bearer inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unauthorized"
                message: "No autorizado: Missing Authorization header"
        "404":
          description: Ningún cliente con ese token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "config_not_found"
                message: "Configuración no encontrada para el cliente: client_123"
        "500":
          description: Fallo de CouchDB u otro error no clasificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "internal_error"
                message: "Error interno: couchdb view query failed"

    put:
      summary: Actualiza la configuración del cliente
      description: |
        Actualiza la configuración del cliente autenticado.
        Requiere el hash de integridad (`sha256:<64 hex>`) para scripts Lua y fallbacks;
        el `PUT` comprueba el formato, la comparación `sha256(code) == code_hash` ocurre
        en tiempo de ejecución antes de correr el script (ver `spec.md`, Fase 4).
        Incrementa automáticamente el config_version (invalida caché sin purga masiva).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientConfigUpdate"
      responses:
        "200":
          description: Configuración actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_version:
                    type: integer
                    description: Nueva versión de configuración
                  updated_at:
                    type: string
                    format: date-time
        "400":
          description: >
            Error de validación. `PUT` valida todos los límites del contrato
            (`max_requests 1..=10000`, `window_seconds 1..=3600`,
            `max_scripting_body_bytes 1048576..=52428800`, `whitelist` de hasta 100
            hosts desnudos sin IP privadas, `code_hash` y el `hash` de cada fallback
            en formato `sha256:<64 hex>`) antes de escribir en CouchDB, y también
            devuelve 400 cuando el cuerpo no deserializa (p. ej. un
            `error_handling.mode` fuera de `transparent`/`wrapped`): Axum respondería
            422 en texto plano, y se normaliza a este contrato. Códigos:
            `invalid_config` para las cotas y los hashes, `invalid_url_format` para
            una URL de fallback no http/https.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                out_of_range:
                  summary: Un límite fuera del rango permitido
                  value:
                    error: "invalid_config"
                    message: "Configuración inválida: rate_limit.max_requests 20000 is outside 1..=10000"
                whitelist_entry_not_a_host:
                  summary: Entrada de whitelist que lleva una cabecera o una IP privada
                  value:
                    error: "invalid_config"
                    message: "Configuración inválida: whitelist 'shutterstock.com:8080' is not a bare domain name"
                bad_fallback_url:
                  summary: URL de fallback malformada
                  value:
                    error: "invalid_url_format"
                    message: "Formato de URL inválido: Invalid scheme 'ftp': only http and https are allowed"
        "401":
          description: Token Bearer inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unauthorized"
                message: "No autorizado: Invalid Authorization format, expected Bearer"
        "404":
          description: Ningún cliente con ese token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "config_not_found"
                message: "Configuración no encontrada para el cliente: client_123"
        "500":
          description: Fallo de CouchDB u otro error no clasificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "internal_error"
                message: "Error interno: couchdb write failed"

  /api/v1/clients/rotate-id:
    post:
      summary: Rota el crypt_id público del cliente
      description: |
        Genera un nuevo nanoid de 12 caracteres para el cliente.
        El crypt_id anterior se invalida inmediatamente.
        Útil si se detecta abuso o exposición no deseada del ID público.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Nuevo crypt_id generado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_crypt_id:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{12}$"
                    example: "9Kp2mX7qR4wL"
                    description: "Nuevo nanoid de 12 caracteres URL-safe"
                  rotated_at:
                    type: string
                    format: date-time
        "401":
          description: Token Bearer inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unauthorized"
                message: "No autorizado: Empty bearer token"
        "404":
          description: Ningún cliente con ese token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "config_not_found"
                message: "Configuración no encontrada para el cliente: client_123"
        "500":
          description: Fallo de CouchDB u otro error no clasificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "internal_error"
                message: "Error interno: couchdb write failed"

  # ========================================
  # ADMINISTRACIÓN GLOBAL (cookie de sesión o master token)
  # ========================================
  # Panel mínimo embebido en GET /admin/ (mismo puerto que la API de control). La autenticación
  # acepta la cookie `teleproxy_admin` (login Google, HttpOnly + SameSite=Lax) o el
  # `MASTER_BEARER_TOKEN` como Bearer — el master SOLO autoriza este router, nunca la API de
  # cliente. Rate limits por IP: login (ADMIN_LOGIN_RATE_LIMIT_*), resto (ADMIN_RATE_LIMIT_*).
  # El código Lua del cliente no aparece en listados; solo en el GET individual.
  /api/v1/admin/auth/google/url:
    get:
      summary: URL de inicio de login con Google
      description: |
        Genera un state OAuth de un solo uso (TTL `ADMIN_OAUTH_STATE_TTL_SECONDS`) y devuelve
        la URL de autorización de Google. La UI redirige el navegador a `url`.
        Si el login Google no está configurado (sin GOOGLE_CLIENT_ID/SECRET): 503.
      responses:
        "200":
          description: URL de autorización
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "429":
          description: Rate limit de login excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Login Google no configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "service_unavailable"
                message: "Servicio no disponible: login con Google no configurado"

  /api/v1/admin/auth/google/callback:
    get:
      summary: Callback OAuth de Google
      description: |
        Consume el state (expirado/inexistente → 400), canjea el code, verifica el id_token
        (JWKS RS256, iss/aud/exp/email_verified) y exige dominio permitido + `admin_user` activo.
        En éxito: Set-Cookie de sesión y redirect 302 a `/admin/`. Los errores se renderizan
        como HTML mínimo (es una ruta de navegador).
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Sesión creada; redirect a /admin/ con Set-Cookie
        "400":
          description: State expirado o desconocido
        "401":
          description: Google rechazó el code o el id_token no verifica
        "403":
          description: Email no verificado, dominio no permitido o admin inexistente/desactivado

  /api/v1/admin/auth/logout:
    post:
      summary: Cierra la sesión admin
      security:
        - AdminSessionCookie: []
        - MasterBearer: []
      responses:
        "200":
          description: Sesión borrada y cookie expirada

  /api/v1/admin/me:
    get:
      summary: Identidad del admin autenticado
      security:
        - AdminSessionCookie: []
        - MasterBearer: []
      responses:
        "200":
          description: Email, rol y vía de autenticación
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, example: "operador@gmail.com" }
                  role: { type: string, example: "admin" }
                  via: { type: string, enum: [session, master] }
        "401":
          description: Sin sesión válida ni master token

  /api/v1/admin/admins:
    get:
      summary: Lista administradores
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Lista completa (email, role, active, created_at, created_by)
    post:
      summary: Añade un administrador
      description: |
        Body `{ "email": "operador@gmail.com" }`. El email debe tener formato válido y dominio
        en `ADMIN_ALLOWED_DOMAINS` (exacto, case-insensitive). El primer admin se crea así,
        autenticado con el master token.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Admin creado }
        "400": { description: Formato de email inválido, dominio no permitido o duplicado }
        "429": { description: Rate limit excedido }

  /api/v1/admin/admins/{email}:
    patch:
      summary: Activa o desactiva un administrador
      description: |
        Body `{ "active": true|false }`. No permite desactivarse a sí mismo.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Estado actualizado }
        "403": { description: Intento de autodesactivación }
        "404": { description: Admin no encontrado }
    delete:
      summary: Elimina un administrador
      description: No permite eliminarse a sí mismo ni al último admin activo (anti-lockout; el master token conserva acceso de emergencia).
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Admin eliminado }
        "403": { description: Autoborrado o último admin activo }

  /api/v1/admin/clients:
    get:
      summary: Lista clientes paginada
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Página de clientes y total de la vista
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients: { type: array, items: { type: object } }
                  total: { type: integer }
    post:
      summary: Crea un cliente nuevo
      description: |
        Genera `internal_id`, `crypt_id` (nanoid 12) y bearer token (nanoid 32). El token en
        claro se devuelve **una sola vez** en `token`; en CouchDB viaja hasheado (`sha256:<hex>`).
        Body opcional `{ "wildcard": true }` para crearlo ya como salida libre (la whitelist
        puede quedar vacía; el anti-SSRF de IP sigue aplicando).
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Cliente creado con su token de un solo uso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Bearer token, se muestra una sola vez" }
                  client: { type: object }

  /api/v1/admin/clients/{id}:
    get:
      summary: Detalle de un cliente (incluye el código Lua)
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: internal_id del cliente
          schema: { type: string }
      responses:
        "200": { description: Config completa (sin `bearer_token_hash`, con `scripting_code`) }
        "404": { description: Cliente no encontrado }
        "403": { description: El documento es kind=Admin, no un cliente }
    put:
      summary: Actualiza la configuración de un cliente
      description: |
        Mismo `ClientConfigUpdate` y mismas validaciones que `PUT /api/v1/clients/config`
        (incluye incremento de `config_version`), más el campo solo-admin `wildcard`
        (`{ "wildcard": true|false }`). El `kind` no es modificable por esta vía.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientConfigUpdate"
      responses:
        "200":
          description: Versión nueva de la configuración
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_version: { type: integer }
                  updated_at: { type: string, format: date-time }
        "400": { description: Error de validación (mismas cotas que el PUT de cliente) }
    delete:
      summary: Elimina un cliente
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "204": { description: Cliente eliminado }
        "404": { description: Cliente no encontrado }

  /api/v1/admin/clients/{id}/rotate-token:
    post:
      summary: Rota el bearer token del cliente
      description: El nuevo token se devuelve **una sola vez**; el hash anterior queda invalidado.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Nuevo token y config
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  client: { type: object }

  /api/v1/admin/clients/{id}/rotate-id:
    post:
      summary: Rota el crypt_id público del cliente
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Nuevo crypt_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_crypt_id: { type: string }
                  rotated_at: { type: string, format: date-time }

  # ========================================
  # SALUD (sin autenticación, en ambos puertos)
  # ========================================
  /health:
    get:
      summary: Livecheck del proceso
      description: |
        Vive en el puerto del proxy (`HTTP_PROXY_PORT`) y en el de control
        (`HTTP_CONTROL_PORT`); no requiere Bearer token. Es el endpoint que usan el
        `HEALTHCHECK` del Dockerfile y el `healthcheck` del compose.
        Solo informa que el proceso atiende peticiones: no comprueba CouchDB ni Valkey,
        porque un 503 aquí derribaría el listener de un proxy que degradó a la config
        default y sigue sirviendo MISS.
      responses:
        "200":
          description: Proceso atendiendo
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token único por cliente para endpoints de control
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: teleproxy_admin
      description: |
        Sesión de administrador creada por el login Google (HttpOnly, SameSite=Lax, TTL
        `ADMIN_SESSION_TTL_SECONDS`). Alternativa en todas las rutas admin el header
        `Authorization: Bearer <MASTER_BEARER_TOKEN>` (MasterBearer).
    MasterBearer:
      type: http
      scheme: bearer
      description: |
        `MASTER_BEARER_TOKEN` como fallback de emergencia. SOLO autoriza `/api/v1/admin/*`:
        la API de cliente (`/api/v1/clients/*`) y el proxy (`/aq/`) no lo aceptan nunca.

  # Nombres de cabecera en el alambre: Pingora escribe en minúsculas los nombres `&'static str`
  # que se le pasan a `ResponseHeader::insert_header` (pingora-http 0.9.0 conserva la casing
  # recibida), así que las respuestas del proxy llevan `x-cache`, `x-proxy-by`,
  # `x-content-type-options` y `retry-after` en minúsculas. El nombre capitalizado que se usa
  # aquí es el canónico de HTTP/2+OpenAPI: la comparación de cabeceras es case-insensitive.
  headers:
    X-Cache:
      description: |
        Decisión de caché de la respuesta. Hoy la emite el handler con literales
        (`interfaces/proxy_handler.rs`: `HIT`, `MISS`, `FALLBACK`, `BYPASS`). En el motor Pingora
        sale de `CacheDirective::as_str()` (`RUST_STYLE_GUIDE.md`), la misma función que usa
        `logging()` para el campo `x_cache`: un único punto para que el header y el log no diverjan.
      schema:
        type: string
        enum: [HIT, MISS, FALLBACK, BYPASS]
        example: "MISS"
    X-Proxy-By:
      description: Identificador del servicio que sirvió la respuesta.
      schema:
        type: string
        example: "tele.velone.ai"
    X-Content-Type-Options:
      description: Evita que el navegador sniff-e el Content-Type del recurso proxificado.
      schema:
        type: string
        example: "nosniff"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código de error del diccionario
          example: "domain_not_whitelisted"
        message:
          type: string
          description: Display del `ProxyError` (dominio/errors.rs); no un texto libre
          example: "Dominio no permitido: malicious.com"

    ClientConfigResponse:
      type: object
      properties:
        crypt_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{12}$"
          example: "V1StGXR8_Z5j"
          description: ID público rotable
        wildcard:
          type: boolean
          default: false
          description: |
            Cliente especial de confianza con salida libre: salta la whitelist de dominios
            y puede salir a CUALQUIER dominio. El anti-SSRF de IP (rechazo de IP privadas,
            pinning DNS, resolución validada) **sigue aplicando igual** — wildcard solo salta
            la capa de whitelist. NO es modificable por el cliente: ni `ClientConfigUpdate`
            ni el `PUT /api/v1/clients/config` lo reciben; solo la API admin
            (`POST/PUT /api/v1/admin/clients`) puede fijarlo o modificarlo.
        config_version:
          type: integer
          description: Versión actual de la configuración
        whitelist:
          type: array
          items:
            type: string
          example: ["shutterstock.com", "gettyimages.com"]
        rate_limit:
          type: object
          properties:
            max_requests:
              type: integer
              minimum: 1
              maximum: 10000
              example: 50
            window_seconds:
              type: integer
              minimum: 1
              maximum: 3600
              example: 60
          description: |
            Mismos límites que `ClientConfigUpdate.rate_limit`: `PUT /api/v1/clients/config`
            los valida y devuelve 400 fuera de rango, así que lo que se lee aquí siempre
            está dentro de ellos.
        max_scripting_body_bytes:
          type: integer
          example: 5242880
          description: Límite de bytes para scripting Lua
        scripting:
          type: object
          properties:
            enabled:
              type: boolean
            code_hash:
              type: string
              description: Hash SHA-256 del script Lua (no se expone el código)
        error_handling:
          type: object
          properties:
            mode:
              type: string
              enum: [transparent, wrapped]
            fallback_urls:
              type: object
              additionalProperties:
                type: object
                properties:
                  url:
                    type: string
                  hash:
                    type: string
        header_rules:
          type: array
          items:
            $ref: "#/components/schemas/HeaderRule"
          description: |
            Reglas de modificación de headers de respuesta. El lenguaje de expresiones y los
            límites completos viven en `docs/HEADER_RULES.md` (sintaxis Cloudflare Rules Engine).

    ClientConfigUpdate:
      type: object
      description: |
        Actualización parcial de la API de cliente (`PUT /api/v1/clients/config`). No incluye
        ni acepta `wildcard` (salida libre) ni `kind`: esos campos son solo-admin y ni siquiera
        deserializan en este payload; activarlos desde el cliente es imposible por construcción.
      type: object
      properties:
        whitelist:
          type: array
          items:
            type: string
          example: ["shutterstock.com", "gettyimages.com"]
        rate_limit:
          type: object
          properties:
            max_requests:
              type: integer
              minimum: 1
              maximum: 10000
            window_seconds:
              type: integer
              minimum: 1
              maximum: 3600
        max_scripting_body_bytes:
          type: integer
          minimum: 1048576
          maximum: 52428800
        scripting:
          type: object
          properties:
            enabled:
              type: boolean
            code:
              type: string
              description: Código Lua completo
            code_hash:
              type: string
              description: Hash SHA-256 del código (obligatorio si se proporciona code)
        error_handling:
          type: object
          properties:
            mode:
              type: string
              enum: [transparent, wrapped]
            fallback_urls:
              type: object
              additionalProperties:
                type: object
                required:
                  - url
                  - hash
                properties:
                  url:
                    type: string
                    format: uri
                  hash:
                    type: string
                    description: Hash SHA-256 del recurso fallback (obligatorio)
        header_rules:
          type: array
          items:
            $ref: "#/components/schemas/HeaderRule"
          description: |
            Sustituye la lista completa de reglas (como `whitelist`); `[]` las desactiva.
            Máximo 50 reglas. Cada expresión se valida (sintaxis, tipos, regex de `matches`)
            antes de escribir: un error devuelve 400 `invalid_config` con el campo concreto,
            p. ej. `header_rules[0].expression`.

    HeaderRule:
      type: object
      required:
        - expression
        - action
        - action_parameters
      properties:
        expression:
          type: string
          maxLength: 4096
          example: |
            http.response.status eq 200 and starts_with(http.response.content_type, "application/json")
          description: |
            Expresión estilo Cloudflare Rules Engine. Campos: `http.response.status`,
            `http.response.content_type`, `http.response.headers["nombre"]`,
            `http.request.method`, `http.request.headers["nombre"]`, `url.scheme`,
            `url.host`, `url.path`, `url.query`. Operadores: `eq`/`ne` (o `==`/`!=`),
            `in { ... }`, `and`/`or`/`not`, paréntesis. Funciones: `starts_with`,
            `ends_with`, `contains`, `matches`, `lower`, `upper`, `len`, `concat`.
            Ver `docs/HEADER_RULES.md`.
        action:
          type: string
          enum: [set]
          description: Acción de la regla (Cloudflare fija `set` en las reglas de headers).
        action_parameters:
          type: object
          required:
            - headers
          properties:
            headers:
              type: array
              maxItems: 10
              items:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    maxLength: 128
                    example: "x-algo"
                    description: |
                      Nombre del header. Se rechazan los que gestiona el proxy
                      (`x-cache`, `x-proxy-by`, `content-length`, `host`, ...).
                  operation:
                    type: string
                    enum: [set, add, remove]
                    default: set
                    description: |
                      `set` reemplaza el valor; `add` acumula valores múltiples;
                      `remove` elimina el header.
                  value:
                    type: string
                    maxLength: 4096
                    example: "host=${url.host};status=${http.response.status}"
                    description: |
                      Obligatorio para `set`/`add`; ignorado en `remove`. Admite placeholders
                      `${campo}` que se expanden contra el contexto de la petición.
