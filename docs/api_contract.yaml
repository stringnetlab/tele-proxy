openapi: 3.0.3
info:
  title: Tele-Proxy API
  version: 1.0.0
  description: |
    API de proxy de acceso remoto con dos niveles de seguridad:
    - Endpoint público sin autenticación (solo whitelist + rate limit)
    - Endpoints de control con Bearer token

paths:
  # ========================================
  # ENDPOINT PÚBLICO (Sin Autenticación)
  # ========================================
  /aq/{crypt_id}/:
    get:
      summary: Proxy público de recursos externos
      description: |
        Endpoint público sin autenticación. La seguridad se gestiona mediante:
        - Validación del crypt_id (nanoid de 12 caracteres)
        - Whitelist de dominios permitidos
        - Rate limit por crypt_id
        - Validación estricta anti-SSRF

        Solo registra errores (4xx, 5xx, bloqueos). No registra solicitudes exitosas.
      parameters:
        - name: crypt_id
          in: path
          required: true
          description: |
            Identificador criptográfico público del cliente (nanoid de 12 caracteres URL-safe).
            Este ID puede ser rotado por el cliente vía la API de control si se detecta abuso.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{12}$"
            example: "V1StGXR8_Z5j"

        - name: url
          in: query
          required: true
          description: |
            URL del recurso externo a proxificar. Debe estar URL-encoded.
            Solo se permiten esquemas http:// y https://.
            No se permiten credenciales embebidas (user:pass@) ni fragmentos (#).
          schema:
            type: string
            format: uri
            example: "https%3A%2F%2Fshutterstock.com%2Fimagen.jpg"

        - name: mime
          in: query
          required: false
          description: |
            MIME type esperado del recurso (opcional).
            Se usa para seleccionar el fallback de error adecuado si el origen falla.
            Prioridad de inferencia: 1) Este parámetro, 2) Extensión de la URL,
            3) `Content-Type` del origen, 4) `application/octet-stream`.
            El header `Accept` del cliente NO interviene: selecciona lo que el cliente acepta,
            no lo que el recurso es, y usarlo para elegir un fallback confundiría un 404
            de imagen con uno de PDF.
          schema:
            type: string
            example: "image/png"

      responses:
        "200":
          description: Recurso obtenido exitosamente
          content:
            "*/*":
              schema:
                type: string
                format: binary
                description: El cuerpo del recurso (imagen, PDF, HTML, etc.)
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
            X-Proxy-By:
              $ref: "#/components/headers/X-Proxy-By"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"

        "400":
          description: URL malformada o con esquema inválido
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid_url_format"
                message: "Formato de URL inválido: URL contains credentials"

        "403":
          description: Dominio no autorizado o SSRF bloqueado
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                domain_not_whitelisted:
                  summary: Dominio fuera de whitelist
                  value:
                    error: "domain_not_whitelisted"
                    message: "Dominio no permitido: malicious.com"
                ssrf_blocked:
                  summary: Intento de SSRF
                  value:
                    error: "ssrf_blocked"
                    message: "Bloqueo anti-SSRF: resolves to private IP"

        "404":
          description: crypt_id inválido o inexistente
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_crypt_id:
                  summary: crypt_id con formato inválido o sin cliente en CouchDB
                  value:
                    error: "invalid_crypt_id"
                    message: "crypt_id inválido: not found"
                config_not_found:
                  summary: La configuración del cliente no existe
                  value:
                    error: "config_not_found"
                    message: "Configuración no encontrada para el cliente: client_123"

        "413":
          description: El cuerpo superado `max_response_size_bytes`
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "payload_too_large"
                message: "Cuerpo demasiado grande: 15728640 bytes (máx: 10485760)"

        "429":
          description: Rate limit excedido
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
              description: Segundos hasta que se puede reintentar
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "rate_limit_exceeded"
                message: "Límite de peticiones excedido"

        "500":
          description: Fallo del proxy o del script Lua (ver ERROR_DICTIONARY.md)
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal_error:
                  summary: Fallo no clasificado
                  value:
                    error: "internal_error"
                    message: "Error interno: cache write failed"
                integrity_check_failed:
                  summary: El hash del script o del fallback no coincide
                  value:
                    error: "integrity_check_failed"
                    message: "Falló la verificación de integridad de lua_script"

        "502":
          description: Error al obtener el recurso del origen o fallo DNS
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                upstream_error:
                  summary: El origen devolvió 4xx/5xx sin fallback aplicable
                  value:
                    error: "upstream_error"
                    message: "Error del origen: status=503, motivo=upstream returned an error status"
                dns_resolution_failed:
                  summary: Todos los resolvers DoT fallaron
                  value:
                    error: "dns_resolution_failed"
                    message: "Falló la resolución DNS de unknown.example: nxdomain"

  /mt/{crypt_id}:
    get:
      summary: Metadata de una URL (preview enriquecido)
      description: |
        Endpoint público del puerto del proxy. Obtiene la URL, la decodifica respetando el charset
        (BOM → `Content-Type` → `<meta charset>`) y extrae una cascada de detectores: Open Graph y
        Twitter Card primero, luego JSON-LD, `<meta>` genéricos y DOM. Para HTML también puede
        extraer el contenido principal (`content=1`) vía readability + Markdown, y siempre reporta
        si la respuesta parecía una pantalla antibot.

        Reutiliza la cadena anti-SSRF de `/aq/` (validación estricta, whitelist del cliente,
        resolución DNS segura y pinning de la IP). Responde en formato JSend: `{ status, statusCode,
        data }`. Las respuestas se cachean (`X-Cache`) según el `ttl` y `force` pedidos y el
        `preview.ttl_max_seconds` del cliente.

        También se acepta la forma con barra final `/mt/{crypt_id}/`.
      parameters:
        - name: crypt_id
          in: path
          required: true
          description: ID público del cliente (nanoid de 12 caracteres URL-safe).
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{12}$"
            example: "V1StGXR8_Z5j"
        - name: url
          in: query
          required: true
          description: URL a inspeccionar, URL-encoded. Solo `http`/`https`, sin credenciales ni fragmento.
          schema:
            type: string
            format: uri
            example: "https%3A%2F%2Fexample.com%2Farticulo"
        - name: content
          in: query
          required: false
          description: |
            `1`/`true`/`yes`/`on` activa la extracción de contenido principal (texto + Markdown).
            Solo aplica si el cliente tiene `preview.capabilities.content` y la respuesta es HTML.
          schema:
            type: string
            example: "1"
        - name: ttl
          in: query
          required: false
          description: TTL de caché pedido en segundos; se limita a `preview.ttl_max_seconds` del cliente.
          schema:
            type: integer
            minimum: 1
            example: 3600
        - name: force
          in: query
          required: false
          description: "`1`/`true`/`yes`/`on` fuerza la reobtención ignorando la caché."
          schema:
            type: string
            example: "0"
      responses:
        "200":
          description: Metadata extraída (JSend success)
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
            X-Degraded-Mode:
              description: Presente cuando el cliente opera en modo degradado (CouchDB/Valkey caídos).
              schema:
                type: string
                example: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          description: Parámetros inválidos (URL ausente, malformada o con esquema prohibido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_url:
                  value: { error: "invalid_preview_params", message: "Parámetros de preview inválidos: falta el parámetro obligatorio `url`" }
                invalid_url:
                  value: { error: "invalid_url_format", message: "Formato de URL inválido: URL contains credentials" }
        "403":
          description: Preview deshabilitado para el cliente, dominio fuera de whitelist o SSRF bloqueado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                preview_disabled:
                  value: { error: "preview_disabled", message: "Preview desactivado: el cliente no tiene `preview.enabled`" }
                capability_off:
                  value: { error: "preview_disabled", message: "Preview desactivado: la capacidad `content` no está activa para este cliente" }
                domain_not_whitelisted:
                  value: { error: "domain_not_whitelisted", message: "Dominio no permitido: malicious.com" }
                ssrf_blocked:
                  value: { error: "ssrf_blocked", message: "Bloqueo anti-SSRF: resolves to private IP" }
        "404":
          description: crypt_id inválido o sin configuración
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "invalid_crypt_id", message: "crypt_id inválido: not found" }
        "413":
          description: La respuesta del origen supera `preview.max_body_bytes`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "preview_payload_too_large", message: "Cuerpo de preview demasiado grande: 3145728 bytes (máx: 2097152)" }
        "429":
          description: Rate limit de preview excedido
          headers:
            Retry-After:
              schema: { type: integer, example: 60 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "rate_limit_exceeded", message: "Límite de peticiones excedido" }
        "502":
          description: El origen falló o no resolvió DNS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "upstream_error", message: "Error del origen: status=503" }

  /pv/{crypt_id}:
    get:
      summary: Preview renderizado (screenshot PNG o PDF)
      description: |
        Endpoint público del puerto del proxy. Delega el render en el sidecar browserless (Chromium)
        y devuelve los bytes del binario directamente (`image/png` o `application/pdf`), sin envoltura
        JSend. Antes de renderizar aplica la misma validación anti-SSRF que `/aq/` y `/mt/` sobre la
        URL destino.

        Es fail-soft: si el sidecar no está configurado (`BROWSERLESS_URL` vacío), no está sano o
        falla, responde 503 `render_unavailable` con `Retry-After`; si excede el timeout, 504
        `render_timeout`. Nunca devuelve 500 por ausencia del sidecar.

        También se acepta la forma con barra final `/pv/{crypt_id}/`.
      parameters:
        - name: crypt_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{12}$"
            example: "V1StGXR8_Z5j"
        - name: url
          in: query
          required: true
          description: URL a renderizar, URL-encoded. Solo `http`/`https`, sin credenciales ni fragmento.
          schema:
            type: string
            format: uri
            example: "https%3A%2F%2Fexample.com%2F"
        - name: format
          in: query
          required: false
          description: "`screenshot` (por omisión) o `pdf`."
          schema:
            type: string
            enum: [screenshot, pdf]
            example: "screenshot"
        - name: fullPage
          in: query
          required: false
          description: |
            `1`/`true`/`yes`/`on` captura la página completa; por omisión usa `preview.screenshot.max_full_page`.
            Solo aplica a `format=screenshot`.
          schema:
            type: string
            example: "1"
        - name: timeout
          in: query
          required: false
          description: Timeout de render pedido en ms; se limita a `RENDER_TIMEOUT_MS` y `preview.max_render_timeout_ms`.
          schema:
            type: integer
            minimum: 1
            example: 20000
      responses:
        "200":
          description: Binario renderizado
          headers:
            X-Cache:
              $ref: "#/components/headers/X-Cache"
          content:
            image/png:
              schema: { type: string, format: binary, description: Screenshot PNG }
            application/pdf:
              schema: { type: string, format: binary, description: PDF }
        "400":
          description: Parámetros inválidos (URL ausente/malformada o `format` desconocido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_format:
                  value: { error: "invalid_preview_params", message: "Parámetros de preview inválidos: formato desconocido: gif (usa screenshot|pdf)" }
                missing_url:
                  value: { error: "invalid_preview_params", message: "Parámetros de preview inválidos: falta el parámetro obligatorio `url`" }
        "403":
          description: Preview o la capacidad de render deshabilitada, whitelist o SSRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                preview_disabled:
                  value: { error: "preview_disabled", message: "Preview desactivado: el cliente no tiene `preview.enabled`" }
                capability_off:
                  value: { error: "preview_disabled", message: "Preview desactivado: la capacidad `screenshot` no está activa para este cliente" }
        "404":
          description: crypt_id inválido o sin configuración
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "invalid_crypt_id", message: "crypt_id inválido: not found" }
        "429":
          description: Rate limit de preview excedido
          headers:
            Retry-After:
              schema: { type: integer, example: 60 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "rate_limit_exceeded", message: "Límite de peticiones excedido" }
        "503":
          description: Sidecar de render ausente, no configurado o no sano (fail-soft)
          headers:
            Retry-After:
              schema: { type: integer, example: 30 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "render_unavailable", message: "Render no disponible: sidecar de render no configurado" }
        "504":
          description: El render superó el timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: "render_timeout", message: "Timeout del render: 20000ms (url=https://example.com/)" }

  # ========================================
  # ENDPOINTS DE CONTROL (Bearer Token)
  # ========================================
  /api/v1/clients/config:
    get:
      summary: Obtiene la configuración del cliente autenticado
      description: |
        Devuelve la configuración completa del cliente, incluyendo:
        - crypt_id actual (público, rotable)
        - whitelist de dominios
        - rate limit
        - configuración de scripting
        - manejo de errores
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfigResponse"
        "401":
          description: Token Bearer inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unauthorized"
                message: "No autorizado: Missing Authorization header"
        "404":
          description: Ningún cliente con ese token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "config_not_found"
                message: "Configuración no encontrada para el cliente: client_123"
        "500":
          description: Fallo de CouchDB u otro error no clasificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "internal_error"
                message: "Error interno: couchdb view query failed"

    put:
      summary: Actualiza la configuración del cliente
      description: |
        Actualiza la configuración del cliente autenticado.
        Requiere el hash de integridad (`sha256:<64 hex>`) para scripts Lua y fallbacks;
        el `PUT` comprueba el formato, la comparación `sha256(code) == code_hash` ocurre
        en tiempo de ejecución antes de correr el script (ver `spec.md`, Fase 4).
        Incrementa automáticamente el config_version (invalida caché sin purga masiva).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientConfigUpdate"
      responses:
        "200":
          description: Configuración actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_version:
                    type: integer
                    description: Nueva versión de configuración
                  updated_at:
                    type: string
                    format: date-time
        "400":
          description: >
            Error de validación. `PUT` valida todos los límites del contrato
            (`max_requests 1..=10000`, `window_seconds 1..=3600`,
            `max_scripting_body_bytes 1048576..=52428800`, `whitelist` de hasta 100
            hosts desnudos sin IP privadas, `code_hash` y el `hash` de cada fallback
            en formato `sha256:<64 hex>`) antes de escribir en CouchDB, y también
            devuelve 400 cuando el cuerpo no deserializa (p. ej. un
            `error_handling.mode` fuera de `transparent`/`wrapped`): Axum respondería
            422 en texto plano, y se normaliza a este contrato. Códigos:
            `invalid_config` para las cotas y los hashes, `invalid_url_format` para
            una URL de fallback no http/https.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                out_of_range:
                  summary: Un límite fuera del rango permitido
                  value:
                    error: "invalid_config"
                    message: "Configuración inválida: rate_limit.max_requests 20000 is outside 1..=10000"
                whitelist_entry_not_a_host:
                  summary: Entrada de whitelist que lleva una cabecera o una IP privada
                  value:
                    error: "invalid_config"
                    message: "Configuración inválida: whitelist 'shutterstock.com:8080' is not a bare domain name"
                bad_fallback_url:
                  summary: URL de fallback malformada
                  value:
                    error: "invalid_url_format"
                    message: "Formato de URL inválido: Invalid scheme 'ftp': only http and https are allowed"
        "401":
          description: Token Bearer inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unauthorized"
                message: "No autorizado: Invalid Authorization format, expected Bearer"
        "404":
          description: Ningún cliente con ese token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "config_not_found"
                message: "Configuración no encontrada para el cliente: client_123"
        "500":
          description: Fallo de CouchDB u otro error no clasificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "internal_error"
                message: "Error interno: couchdb write failed"

  /api/v1/clients/rotate-id:
    post:
      summary: Rota el crypt_id público del cliente
      description: |
        Genera un nuevo nanoid de 12 caracteres para el cliente.
        El crypt_id anterior se invalida inmediatamente.
        Útil si se detecta abuso o exposición no deseada del ID público.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Nuevo crypt_id generado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_crypt_id:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{12}$"
                    example: "9Kp2mX7qR4wL"
                    description: "Nuevo nanoid de 12 caracteres URL-safe"
                  rotated_at:
                    type: string
                    format: date-time
        "401":
          description: Token Bearer inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "unauthorized"
                message: "No autorizado: Empty bearer token"
        "404":
          description: Ningún cliente con ese token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "config_not_found"
                message: "Configuración no encontrada para el cliente: client_123"
        "500":
          description: Fallo de CouchDB u otro error no clasificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "internal_error"
                message: "Error interno: couchdb write failed"

  # ========================================
  # ADMINISTRACIÓN GLOBAL (cookie de sesión o master token)
  # ========================================
  # Panel mínimo embebido en GET /admin/ (mismo puerto que la API de control). La autenticación
  # acepta la cookie `teleproxy_admin` (login Google, HttpOnly + SameSite=Lax) o el
  # `MASTER_BEARER_TOKEN` como Bearer — el master SOLO autoriza este router, nunca la API de
  # cliente. Rate limits por IP: login (ADMIN_LOGIN_RATE_LIMIT_*), resto (ADMIN_RATE_LIMIT_*).
  # El código Lua del cliente no aparece en listados; solo en el GET individual.
  /api/v1/admin/auth/google/url:
    get:
      summary: URL de inicio de login con Google
      description: |
        Genera un state OAuth de un solo uso (TTL `ADMIN_OAUTH_STATE_TTL_SECONDS`) y devuelve
        la URL de autorización de Google. La UI redirige el navegador a `url`.
        Si el login Google no está configurado (sin GOOGLE_CLIENT_ID/SECRET): 503.
      responses:
        "200":
          description: URL de autorización
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "429":
          description: Rate limit de login excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Login Google no configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "service_unavailable"
                message: "Servicio no disponible: login con Google no configurado"

  /api/v1/admin/auth/google/callback:
    get:
      summary: Callback OAuth de Google
      description: |
        Consume el state (expirado/inexistente → 400), canjea el code, verifica el id_token
        (JWKS RS256, iss/aud/exp/email_verified) y exige dominio permitido + `admin_user` activo.
        En éxito: Set-Cookie de sesión y redirect 302 a `/admin/`. Los errores se renderizan
        como HTML mínimo (es una ruta de navegador).
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Sesión creada; redirect a /admin/ con Set-Cookie
        "400":
          description: State expirado o desconocido
        "401":
          description: Google rechazó el code o el id_token no verifica
        "403":
          description: Email no verificado, dominio no permitido o admin inexistente/desactivado

  /api/v1/admin/auth/logout:
    post:
      summary: Cierra la sesión admin
      security:
        - AdminSessionCookie: []
        - MasterBearer: []
      responses:
        "200":
          description: Sesión borrada y cookie expirada

  /api/v1/admin/me:
    get:
      summary: Identidad del admin autenticado
      security:
        - AdminSessionCookie: []
        - MasterBearer: []
      responses:
        "200":
          description: Email, rol y vía de autenticación
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, example: "operador@gmail.com" }
                  role: { type: string, example: "admin" }
                  via: { type: string, enum: [session, master] }
        "401":
          description: Sin sesión válida ni master token

  /api/v1/admin/admins:
    get:
      summary: Lista administradores
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Lista completa (email, role, active, created_at, created_by)
    post:
      summary: Añade un administrador
      description: |
        Body `{ "email": "operador@gmail.com" }`. El email debe tener formato válido y dominio
        en `ADMIN_ALLOWED_DOMAINS` (exacto, case-insensitive). El primer admin se crea así,
        autenticado con el master token.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Admin creado }
        "400": { description: Formato de email inválido, dominio no permitido o duplicado }
        "429": { description: Rate limit excedido }

  /api/v1/admin/admins/{email}:
    patch:
      summary: Activa o desactiva un administrador
      description: |
        Body `{ "active": true|false }`. No permite desactivarse a sí mismo.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Estado actualizado }
        "403": { description: Intento de autodesactivación }
        "404": { description: Admin no encontrado }
    delete:
      summary: Elimina un administrador
      description: No permite eliminarse a sí mismo ni al último admin activo (anti-lockout; el master token conserva acceso de emergencia).
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Admin eliminado }
        "403": { description: Autoborrado o último admin activo }

  /api/v1/admin/clients:
    get:
      summary: Lista clientes paginada
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Página de clientes y total de la vista
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients: { type: array, items: { type: object } }
                  total: { type: integer }
    post:
      summary: Crea un cliente nuevo
      description: |
        Genera `internal_id`, `crypt_id` (nanoid 12) y bearer token (nanoid 32). El token en
        claro se devuelve **una sola vez** en `token`; en CouchDB viaja hasheado (`sha256:<hex>`).
        Body opcional `{ "wildcard": true }` para crearlo ya como salida libre (la whitelist
        puede quedar vacía; el anti-SSRF de IP sigue aplicando).
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Cliente creado con su token de un solo uso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Bearer token, se muestra una sola vez" }
                  client: { type: object }

  /api/v1/admin/clients/{id}:
    get:
      summary: Detalle de un cliente (incluye el código Lua)
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: internal_id del cliente
          schema: { type: string }
      responses:
        "200": { description: Config completa (sin `bearer_token_hash`, con `scripting_code`) }
        "404": { description: Cliente no encontrado }
        "403": { description: El documento es kind=Admin, no un cliente }
    put:
      summary: Actualiza la configuración de un cliente
      description: |
        Mismo `ClientConfigUpdate` y mismas validaciones que `PUT /api/v1/clients/config`
        (incluye incremento de `config_version`), más el campo solo-admin `wildcard`
        (`{ "wildcard": true|false }`). El `kind` no es modificable por esta vía.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientConfigUpdate"
      responses:
        "200":
          description: Versión nueva de la configuración
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_version: { type: integer }
                  updated_at: { type: string, format: date-time }
        "400": { description: Error de validación (mismas cotas que el PUT de cliente) }
    delete:
      summary: Elimina un cliente
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "204": { description: Cliente eliminado }
        "404": { description: Cliente no encontrado }

  /api/v1/admin/clients/{id}/rotate-token:
    post:
      summary: Rota el bearer token del cliente
      description: El nuevo token se devuelve **una sola vez**; el hash anterior queda invalidado.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Nuevo token y config
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  client: { type: object }

  /api/v1/admin/clients/{id}/rotate-id:
    post:
      summary: Rota el crypt_id público del cliente
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Nuevo crypt_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_crypt_id: { type: string }
                  rotated_at: { type: string, format: date-time }

  /api/v1/admin/settings:
    get:
      summary: Ajustes globales efectivos del proxy
      description: |
        Devuelve los `runtime_settings` **efectivos** en curso (no el documento crudo de CouchDB):
        un campo ausente en el documento aparece aquí resuelto a su valor por defecto. Son los
        valores recargables en caliente que antes vivían congelados en el arranque o como `const`
        del compilador. Quedan fuera a propósito los puertos/`HTTP_HOST`, las URLs y credenciales
        de CouchDB/Valkey, el material de identidad (master token, CORS, Google OAuth) y
        `config/dns_resolvers.json` (política anti-SSRF embebida en el binario).
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      responses:
        "200":
          description: Ajustes efectivos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettings"
        "429": { description: Rate limit de admin excedido }
    patch:
      summary: Actualización parcial de los ajustes globales
      description: |
        Body con solo los campos a cambiar (`RuntimeSettingsPatch`); un campo ausente no se toca.
        Se valida el resultado **completo** contra los rangos de `RuntimeSettings` (incluye el
        invariante entre campos `cacheable_size_bytes <= max_response_bytes`), se persiste en
        CouchDB con concurrencia optimista (`_rev`) y se instala en el store en memoria, de modo
        que el cambio es efectivo sin esperar al feed `_changes`. La mutación exige el header
        `X-Admin-UI` cuando CORS está activo (misma regla CSRF que el resto del router admin) y
        deja una entrada de auditoría `settings_update`. Un patch vacío es `400 invalid_config`.
        `verbose_errors: true` revela el motivo interno en los cuerpos de error: activarlo emite
        además un WARN explícito en el log.
      security: [{ AdminSessionCookie: [] }, { MasterBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSettingsPatch"
      responses:
        "200":
          description: Ajustes efectivos tras aplicar el patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettings"
        "400": { description: "Patch vacío o valor fuera de rango (invalid_config, cita el campo)" }
        "409": { description: Conflicto de `_rev` con otra escritura concurrente }
        "429": { description: Rate limit de admin excedido }

  # ========================================
  # SALUD (sin autenticación, en ambos puertos)
  # ========================================
  /health:
    get:
      summary: Livecheck del proceso
      description: |
        Vive en el puerto del proxy (`HTTP_PROXY_PORT`) y en el de control
        (`HTTP_CONTROL_PORT`); no requiere Bearer token. Es el endpoint que usan el
        `HEALTHCHECK` del Dockerfile y el `healthcheck` del compose.
        Solo informa que el proceso atiende peticiones: no comprueba CouchDB ni Valkey,
        porque un 503 aquí derribaría el listener de un proxy que degradó a la config
        default y sigue sirviendo MISS.
      responses:
        "200":
          description: Proceso atendiendo
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token único por cliente para endpoints de control
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: teleproxy_admin
      description: |
        Sesión de administrador creada por el login Google (HttpOnly, SameSite=Lax, TTL
        `ADMIN_SESSION_TTL_SECONDS`). Alternativa en todas las rutas admin el header
        `Authorization: Bearer <MASTER_BEARER_TOKEN>` (MasterBearer).
    MasterBearer:
      type: http
      scheme: bearer
      description: |
        `MASTER_BEARER_TOKEN` como fallback de emergencia. SOLO autoriza `/api/v1/admin/*`:
        la API de cliente (`/api/v1/clients/*`) y el proxy (`/aq/`) no lo aceptan nunca.

  # Nombres de cabecera en el alambre: Pingora escribe en minúsculas los nombres `&'static str`
  # que se le pasan a `ResponseHeader::insert_header` (pingora-http 0.9.0 conserva la casing
  # recibida), así que las respuestas del proxy llevan `x-cache`, `x-proxy-by`,
  # `x-content-type-options` y `retry-after` en minúsculas. El nombre capitalizado que se usa
  # aquí es el canónico de HTTP/2+OpenAPI: la comparación de cabeceras es case-insensitive.
  headers:
    X-Cache:
      description: |
        Decisión de caché de la respuesta. Hoy la emite el handler con literales
        (`interfaces/proxy_handler.rs`: `HIT`, `MISS`, `FALLBACK`, `BYPASS`). En el motor Pingora
        sale de `CacheDirective::as_str()` (`RUST_STYLE_GUIDE.md`), la misma función que usa
        `logging()` para el campo `x_cache`: un único punto para que el header y el log no diverjan.
      schema:
        type: string
        enum: [HIT, MISS, FALLBACK, BYPASS]
        example: "MISS"
    X-Proxy-By:
      description: Identificador del servicio que sirvió la respuesta.
      schema:
        type: string
        example: "tele.velone.ai"
    X-Content-Type-Options:
      description: Evita que el navegador sniff-e el Content-Type del recurso proxificado.
      schema:
        type: string
        example: "nosniff"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código de error del diccionario
          example: "domain_not_whitelisted"
        message:
          type: string
          description: Display del `ProxyError` (dominio/errors.rs); no un texto libre
          example: "Dominio no permitido: malicious.com"

    PreviewConfig:
      type: object
      description: |
        Sección `preview` de la configuración del cliente (D6). `enabled` es fail-safe: si el
        documento no la trae, nace `false` y `/mt/` y `/pv/` responden 403 `preview_disabled`.
        Los topes duros (`max_body_bytes`, `max_render_timeout_ms`, ...) se validan contra los
        `MAX_PREVIEW_*` de `domain/validators.rs`; fuera de rango → 400 `invalid_config`.
      properties:
        enabled:
          type: boolean
          default: false
          description: Interruptor maestro de `/mt/` y `/pv/` para el cliente.
        capabilities:
          type: object
          description: Capacidades finas. Cada una se comprueba en su endpoint antes de trabajar.
          properties:
            meta:
              type: boolean
              default: true
            content:
              type: boolean
              default: true
              description: Extracción de contenido principal (`content=1` en `/mt/`).
            screenshot:
              type: boolean
              default: false
            pdf:
              type: boolean
              default: false
        rate_limit:
          type: object
          description: Límite propio de preview (independiente del de `/aq/`).
          properties:
            max_requests:
              type: integer
              minimum: 1
              example: 60
            window_seconds:
              type: integer
              minimum: 1
              example: 60
        ttl_default_seconds:
          type: integer
          example: 86400
          description: TTL de caché por omisión cuando la petición no pide `ttl`.
        ttl_max_seconds:
          type: integer
          example: 2678400
          description: Techo del `ttl` pedido por query; debe ser ≥ `ttl_default_seconds`.
        max_render_timeout_ms:
          type: integer
          example: 45000
          description: Techo del timeout de render por cliente (≤ `MAX_PREVIEW_RENDER_TIMEOUT_MS`).
        max_body_bytes:
          type: integer
          example: 2097152
          description: Tope del cuerpo a parsear en `/mt/` (≤ `MAX_PREVIEW_BODY_BYTES`).
        screenshot:
          type: object
          properties:
            max_full_page:
              type: boolean
              default: true
              description: Valor por omisión de `fullPage` cuando la query no lo fija.
            default_viewport:
              type: array
              items: { type: integer }
              minItems: 2
              maxItems: 2
              example: [1920, 1080]
              description: "`[ancho, alto]`; cada lado ≤ `MAX_PREVIEW_VIEWPORT_SIDE`."

    PreviewResponse:
      type: object
      description: Envolvente JSend de `/mt/`. En éxito `status="success"` y `data` relleno.
      required: [status, statusCode]
      properties:
        status:
          type: string
          enum: [success, fail, error]
          example: "success"
        statusCode:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/PreviewData"

    PreviewData:
      type: object
      description: |
        Resultado de la cascada de detectores (OG/Twitter → JSON-LD → `<meta>` → DOM → content-type).
        Todo campo salvo `antibot` se omite cuando no se encontró nada (`skip_serializing_if`).
      properties:
        url:
          type: string
          format: uri
          description: URL final tras los redirects revalidados.
        title: { type: string }
        description: { type: string }
        author: { type: string }
        date: { type: string }
        lang: { type: string }
        publisher: { type: string }
        siteName: { type: string }
        image:
          $ref: "#/components/schemas/MediaInfo"
        logo:
          $ref: "#/components/schemas/MediaInfo"
        video:
          $ref: "#/components/schemas/MediaInfo"
        audio:
          $ref: "#/components/schemas/MediaInfo"
        favicons:
          type: array
          items:
            $ref: "#/components/schemas/MediaInfo"
        openGraph:
          type: object
          additionalProperties: { type: string }
          description: Metadatos `og:*` con el prefijo retirado.
          example: { title: "Ejemplo", image: "https://example.com/og.png" }
        twitter:
          type: object
          additionalProperties: { type: string }
          description: Metadatos `twitter:*` con el prefijo retirado.
        jsonLd:
          type: array
          description: Objetos JSON-LD tal cual se extrajeron del `<script type="application/ld+json">`.
          items:
            type: object
        content:
          $ref: "#/components/schemas/ContentInfo"
        antibot:
          $ref: "#/components/schemas/AntibotInfo"

    MediaInfo:
      type: object
      description: Objeto de media reutilizable (imagen/logo/video/audio/favicon).
      properties:
        url: { type: string, format: uri }
        type:
          type: string
          description: MIME resuelto (content-type del origen o inferido del sufijo).
          example: "image/png"
        size: { type: integer, description: Bytes }
        sizePretty:
          type: string
          description: "`size` formateado, base 1000, una cifra decimal."
          example: "84.1 KB"
        width: { type: integer }
        height: { type: integer }
        duration: { type: number, description: "Segundos (video/audio)" }

    ContentInfo:
      type: object
      description: Contenido principal extraído (solo con `content=1` y capacidad `content`).
      properties:
        text: { type: string, description: Texto plano del artículo }
        markdown: { type: string, description: "`text`/HTML del artículo convertido a Markdown (htmd)" }

    AntibotInfo:
      type: object
      description: |
        Siempre presente en `PreviewData` (D3): `detected=false` es información útil. La detección
        es declarativa (`domain/preview/antibot.rs`): cabeceras/cookies/HTML de proveedores conocidos.
      required: [detected]
      properties:
        detected:
          type: boolean
          example: false
        provider:
          type: string
          description: Nombre del proveedor detectado (p. ej. `cloudflare`, `datadome`).
          example: "datadome"
        technique:
          type: string
          enum: [javascript, captcha, waf, cookie]
          example: "captcha"

    ClientConfigResponse:
      type: object
      properties:
        crypt_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{12}$"
          example: "V1StGXR8_Z5j"
          description: ID público rotable
        wildcard:
          type: boolean
          default: false
          description: |
            Cliente especial de confianza con salida libre: salta la whitelist de dominios
            y puede salir a CUALQUIER dominio. El anti-SSRF de IP (rechazo de IP privadas,
            pinning DNS, resolución validada) **sigue aplicando igual** — wildcard solo salta
            la capa de whitelist. NO es modificable por el cliente: ni `ClientConfigUpdate`
            ni el `PUT /api/v1/clients/config` lo reciben; solo la API admin
            (`POST/PUT /api/v1/admin/clients`) puede fijarlo o modificarlo.
        config_version:
          type: integer
          description: Versión actual de la configuración
        whitelist:
          type: array
          items:
            type: string
          example: ["shutterstock.com", "gettyimages.com"]
        rate_limit:
          type: object
          properties:
            max_requests:
              type: integer
              minimum: 1
              maximum: 10000
              example: 50
            window_seconds:
              type: integer
              minimum: 1
              maximum: 3600
              example: 60
          description: |
            Mismos límites que `ClientConfigUpdate.rate_limit`: `PUT /api/v1/clients/config`
            los valida y devuelve 400 fuera de rango, así que lo que se lee aquí siempre
            está dentro de ellos.
        max_scripting_body_bytes:
          type: integer
          example: 5242880
          description: Límite de bytes para scripting Lua
        scripting:
          type: object
          properties:
            enabled:
              type: boolean
            code_hash:
              type: string
              description: Hash SHA-256 del script Lua (no se expone el código)
        error_handling:
          type: object
          properties:
            mode:
              type: string
              enum: [transparent, wrapped]
            fallback_urls:
              type: object
              additionalProperties:
                type: object
                properties:
                  url:
                    type: string
                  hash:
                    type: string
        header_rules:
          type: array
          items:
            $ref: "#/components/schemas/HeaderRule"
          description: |
            Reglas de modificación de headers de respuesta. El lenguaje de expresiones y los
            límites completos viven en `docs/HEADER_RULES.md` (sintaxis Cloudflare Rules Engine).
        preview:
          $ref: "#/components/schemas/PreviewConfig"

    ClientConfigUpdate:
      type: object
      description: |
        Actualización parcial de la API de cliente (`PUT /api/v1/clients/config`). No incluye
        ni acepta `wildcard` (salida libre) ni `kind`: esos campos son solo-admin y ni siquiera
        deserializan en este payload; activarlos desde el cliente es imposible por construcción.
      properties:
        whitelist:
          type: array
          items:
            type: string
          example: ["shutterstock.com", "gettyimages.com"]
        rate_limit:
          type: object
          properties:
            max_requests:
              type: integer
              minimum: 1
              maximum: 10000
            window_seconds:
              type: integer
              minimum: 1
              maximum: 3600
        max_scripting_body_bytes:
          type: integer
          minimum: 1048576
          maximum: 52428800
        scripting:
          type: object
          properties:
            enabled:
              type: boolean
            code:
              type: string
              description: Código Lua completo
            code_hash:
              type: string
              description: Hash SHA-256 del código (obligatorio si se proporciona code)
        error_handling:
          type: object
          properties:
            mode:
              type: string
              enum: [transparent, wrapped]
            fallback_urls:
              type: object
              additionalProperties:
                type: object
                required:
                  - url
                  - hash
                properties:
                  url:
                    type: string
                    format: uri
                  hash:
                    type: string
                    description: Hash SHA-256 del recurso fallback (obligatorio)
        header_rules:
          type: array
          items:
            $ref: "#/components/schemas/HeaderRule"
          description: |
            Sustituye la lista completa de reglas (como `whitelist`); `[]` las desactiva.
            Máximo 50 reglas. Cada expresión se valida (sintaxis, tipos, regex de `matches`)
            antes de escribir: un error devuelve 400 `invalid_config` con el campo concreto,
            p. ej. `header_rules[0].expression`.
        preview:
          $ref: "#/components/schemas/PreviewConfig"

    HeaderRule:
      type: object
      required:
        - expression
        - action
        - action_parameters
      properties:
        expression:
          type: string
          maxLength: 4096
          example: |
            http.response.status eq 200 and starts_with(http.response.content_type, "application/json")
          description: |
            Expresión estilo Cloudflare Rules Engine. Campos: `http.response.status`,
            `http.response.content_type`, `http.response.headers["nombre"]`,
            `http.request.method`, `http.request.headers["nombre"]`, `url.scheme`,
            `url.host`, `url.path`, `url.query`. Operadores: `eq`/`ne` (o `==`/`!=`),
            `in { ... }`, `and`/`or`/`not`, paréntesis. Funciones: `starts_with`,
            `ends_with`, `contains`, `matches`, `lower`, `upper`, `len`, `concat`.
            Ver `docs/HEADER_RULES.md`.
        action:
          type: string
          enum: [set]
          description: Acción de la regla (Cloudflare fija `set` en las reglas de headers).
        action_parameters:
          type: object
          required:
            - headers
          properties:
            headers:
              type: array
              maxItems: 10
              items:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    maxLength: 128
                    example: "x-algo"
                    description: |
                      Nombre del header. Se rechazan los que gestiona el proxy
                      (`x-cache`, `x-proxy-by`, `content-length`, `host`, ...).
                  operation:
                    type: string
                    enum: [set, add, remove]
                    default: set
                    description: |
                      `set` reemplaza el valor; `add` acumula valores múltiples;
                      `remove` elimina el header.
                  value:
                    type: string
                    maxLength: 4096
                    example: "host=${url.host};status=${http.response.status}"
                    description: |
                      Obligatorio para `set`/`add`; ignorado en `remove`. Admite placeholders
                      `${campo}` que se expanden contra el contexto de la petición.

    RuntimeSettings:
      type: object
      description: |
        Ajustes globales del proxy recargables en caliente. Los rangos reflejan **exactamente**
        `RuntimeSettings::validate()` (`domain/runtime_settings.rs`); fuera de rango se rechaza la
        escritura entera con `400 invalid_config` citando el campo culpable (sin clamp silencioso,
        para que panel y proxy no discrepen sobre el valor efectivo). Los `default` reproducen los
        valores históricos congelados, de modo que un despliegue sin documento en CouchDB se
        comporta igual que antes.
      properties:
        upstream_user_agent:
          type: string
          maxLength: 256
          default: ""
          description: |
            User-Agent por defecto para el origen; vacío = el de reqwest. Nunca pisa el que envíe
            el cliente. Se rechazan los caracteres de control ASCII (anti inyección de cabeceras).
        upstream_timeout_secs:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
        max_response_bytes:
          type: integer
          minimum: 1048576
          maximum: 536870912
          default: 104857600
          description: Techo de lectura del cuerpo del origen (1 MiB .. 512 MiB; default 100 MiB).
        cacheable_size_bytes:
          type: integer
          minimum: 1024
          maximum: 536870912
          default: 5242880
          description: |
            Por encima de este tamaño la respuesta no se cachea en Valkey (1 KiB .. 512 MiB;
            default 5 MiB). Invariante: no puede superar `max_response_bytes`.
        stale_cache_ttl_secs:
          type: integer
          minimum: 60
          maximum: 604800
          default: 86400
        cache_ttl_images_secs:
          type: integer
          minimum: 1
          maximum: 604800
          default: 3600
        cache_ttl_assets_secs:
          type: integer
          minimum: 1
          maximum: 604800
          default: 1800
        cache_ttl_default_secs:
          type: integer
          minimum: 1
          maximum: 604800
          default: 300
        lua_timeout_ms:
          type: integer
          minimum: 1
          maximum: 60000
          default: 200
        lua_memory_limit_mb:
          type: integer
          minimum: 1
          maximum: 1024
          default: 50
        webhook_timeout_ms:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
        verbose_errors:
          type: boolean
          default: false
          description: |
            `MODO=desarrollo` en caliente: los errores HTTP exponen el motivo interno y `details`.
            Editable solo por rol `admin` con auditoría; activarlo revela información interna.

    RuntimeSettingsPatch:
      type: object
      description: |
        Cuerpo del `PATCH /api/v1/admin/settings`: los mismos campos que `RuntimeSettings` pero
        opcionales (ausente = no se toca). Un patch vacío (`{}`) se rechaza con `400`. Cada campo
        presente se valida contra el rango de `RuntimeSettings`.
      properties:
        upstream_user_agent: { type: string, maxLength: 256 }
        upstream_timeout_secs: { type: integer, minimum: 1, maximum: 300 }
        max_response_bytes: { type: integer, minimum: 1048576, maximum: 536870912 }
        cacheable_size_bytes: { type: integer, minimum: 1024, maximum: 536870912 }
        stale_cache_ttl_secs: { type: integer, minimum: 60, maximum: 604800 }
        cache_ttl_images_secs: { type: integer, minimum: 1, maximum: 604800 }
        cache_ttl_assets_secs: { type: integer, minimum: 1, maximum: 604800 }
        cache_ttl_default_secs: { type: integer, minimum: 1, maximum: 604800 }
        lua_timeout_ms: { type: integer, minimum: 1, maximum: 60000 }
        lua_memory_limit_mb: { type: integer, minimum: 1, maximum: 1024 }
        webhook_timeout_ms: { type: integer, minimum: 1, maximum: 60000 }
        verbose_errors: { type: boolean }
